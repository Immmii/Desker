<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Task Tracker References</title>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #e8e8e8; font-family: -apple-system, sans-serif; padding: 40px; }
    h1 { font-size: 20px; font-weight: 700; margin-bottom: 24px; color: #1d1d1f; }
    .row { display: flex; gap: 32px; align-items: flex-start; }
    .card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; color: #333; }
    .card img { border-radius: 8px; display: block; }
  </style>
</head>
<body>
  <h1>Task Tracker 레퍼런스 (추가)</h1>
  <div class="row">
    <div class="card">
      <h2>Notion — 상태별 칸반 (시작전 / 진행중 / 완료)</h2>
      <img src="/ref-notion-kanban.png" width="500" />
    </div>
    <div class="card">
      <h2>Naver Calendar — 캘린더 트래킹 (색상 구분)</h2>
      <img src="/ref-naver-calendar.jpeg" width="300" />
    </div>
  </div>
</body>
</html>
