<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Desker Sidebar Icons</title>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f0f13; color: #e8e8f0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 40px; }
    h1 { font-size: 18px; margin-bottom: 24px; color: #9090a8; }
    .grid { display: flex; gap: 32px; flex-wrap: wrap; }
    .icon-card {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 24px 20px; background: #1a1a24; border-radius: 16px; border: 1px solid #2e2e42; width: 120px;
    }
    .icon-card.active { border-color: #6c5ce7; }
    .icon-wrap {
      width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
      background: transparent; color: #9090a8;
    }
    .icon-card.active .icon-wrap { background: #6c5ce7; color: white; }
    .icon-label { font-size: 13px; color: #9090a8; }
    .icon-card.active .icon-label { color: #e8e8f0; }
    svg { display: block; }
    .section { margin-top: 40px; }
    .row { display: flex; gap: 4px; align-items: center; background: #1a1a24; border-radius: 16px; padding: 12px 6px; flex-direction: column; width: 68px; }
    .row-item { display: flex; flex-direction: column; align-items: center; padding: 10px 0; width: 100%; position: relative; cursor: pointer; }
    .row-item.active .icon-wrap-sm { background: #6c5ce7; color: white; }
    .row-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 24px; background: #6c5ce7; border-radius: 0 3px 3px 0; }
    .icon-wrap-sm { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #9090a8; }
    .row-label { font-size: 9px; margin-top: 4px; color: #9090a8; }
    .row-item.active .row-label { color: #e8e8f0; }
  </style>
</head>
<body>
  <h1>Desker — Sidebar Icons (SVG, 24x24, stroke)</h1>

  <!-- Individual icons -->
  <div class="grid">
    <div class="icon-card active">
      <div class="icon-wrap">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5"/>
          <path d="M5 9.5V19a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1V9.5"/>
        </svg>
      </div>
      <div class="icon-label">홈</div>
    </div>
    <div class="icon-card">
      <div class="icon-wrap">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <line x1="3" y1="9" x2="21" y2="9"/>
          <line x1="3" y1="15" x2="21" y2="15"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
          <line x1="15" y1="3" x2="15" y2="21"/>
          <circle cx="19" cy="19" r="2.5" fill="currentColor" stroke="none" opacity="0.5"/>
        </svg>
      </div>
      <div class="icon-label">에디터</div>
    </div>
    <div class="icon-card">
      <div class="icon-wrap">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/>
          <path d="M7 8l2 2 4-4"/>
          <line x1="7" y1="14" x2="17" y2="14"/>
          <line x1="7" y1="18" x2="13" y2="18"/>
        </svg>
      </div>
      <div class="icon-label">태스크</div>
    </div>
    <div class="icon-card">
      <div class="icon-wrap">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"/>
          <polyline points="7,10 10,13 7,16"/>
          <line x1="13" y1="16" x2="17" y2="16"/>
        </svg>
      </div>
      <div class="icon-label">터미널</div>
    </div>
    <div class="icon-card">
      <div class="icon-wrap">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 3v4"/>
          <path d="M15 3v4"/>
          <path d="M6 7h12a1 1 0 011 1v3a6 6 0 01-6 6h0a6 6 0 01-6-6V8a1 1 0 011-1z"/>
          <path d="M12 17v4"/>
        </svg>
      </div>
      <div class="icon-label">플러그인</div>
    </div>
    <div class="icon-card">
      <div class="icon-wrap">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/>
        </svg>
      </div>
      <div class="icon-label">설정</div>
    </div>
  </div>

  <!-- Assembled sidebar preview -->
  <div class="section">
    <h1 style="margin-bottom: 16px;">Sidebar Preview (assembled)</h1>
    <div class="row">
      <div class="row-item active">
        <div class="icon-wrap-sm" style="background:#6c5ce7;color:white;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V19a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1V9.5"/>
          </svg>
        </div>
        <div class="row-label" style="color:#e8e8f0;">홈</div>
      </div>
      <div class="row-item">
        <div class="icon-wrap-sm">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/><line x1="15" y1="3" x2="15" y2="21"/><circle cx="19" cy="19" r="2.5" fill="currentColor" stroke="none" opacity="0.5"/>
          </svg>
        </div>
        <div class="row-label">에디터</div>
      </div>
      <div class="row-item">
        <div class="icon-wrap-sm">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 8l2 2 4-4"/><line x1="7" y1="14" x2="17" y2="14"/><line x1="7" y1="18" x2="13" y2="18"/>
          </svg>
        </div>
        <div class="row-label">태스크</div>
      </div>
      <div class="row-item">
        <div class="icon-wrap-sm">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/><polyline points="7,10 10,13 7,16"/><line x1="13" y1="16" x2="17" y2="16"/>
          </svg>
        </div>
        <div class="row-label">터미널</div>
      </div>
      <div class="row-item">
        <div class="icon-wrap-sm">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3v4"/><path d="M15 3v4"/><path d="M6 7h12a1 1 0 011 1v3a6 6 0 01-6 6h0a6 6 0 01-6-6V8a1 1 0 011-1z"/><path d="M12 17v4"/>
          </svg>
        </div>
        <div class="row-label">플러그인</div>
      </div>
      <div style="border-top: 1px solid #2e2e42; width: 100%; margin: 4px 0;"></div>
      <div class="row-item">
        <div class="icon-wrap-sm">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M1 12h3M20 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/>
          </svg>
        </div>
        <div class="row-label">설정</div>
      </div>
    </div>
  </div>
</body>
</html>
