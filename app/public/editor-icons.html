<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Desker Editor Icons</title>
  <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f5f5f7; font-family: -apple-system, sans-serif; padding: 48px; color: #1d1d1f; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
    h1 span { color: #6c5ce7; }
    .subtitle { font-size: 13px; color: #86868b; margin-bottom: 40px; }
    .section-title { font-size: 13px; font-weight: 600; color: #6c5ce7; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; }
    .grid { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 48px; }
    .icon-card { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 80px; }
    .icon-box { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #f0f0f2; color: #1d1d1f; }
    .icon-box.dark { background: #2e2e42; color: #9090a8; }
    .icon-name { font-size: 11px; color: #86868b; text-align: center; }
    .row { display: flex; gap: 48px; }
  </style>
</head>
<body>

<h1>Desker <span>Editor Icons</span></h1>
<p class="subtitle">도트 에디터 전용 아이콘 세트 — SVG, 18×18, stroke 1.5</p>

<div class="row">
  <div>
    <div class="section-title">Tools (Light)</div>
    <div class="grid">
      <div class="icon-card">
        <div class="icon-box">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11.5 2.5l4 4L5.5 16.5H1.5v-4L11.5 2.5z"/><path d="M9.5 4.5l4 4"/>
          </svg>
        </div>
        <div class="icon-name">연필</div>
      </div>
      <div class="icon-card">
        <div class="icon-box">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15.5 9.5l-5-5-7 7 3 3h4l5-5z"/><path d="M3.5 11.5l5 5"/><line x1="8.5" y1="16.5" x2="16.5" y2="16.5"/>
          </svg>
        </div>
        <div class="icon-name">지우개</div>
      </div>
      <div class="icon-card">
        <div class="icon-box">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 12.5l7-7 3 3-7 7h-3v-3z"/><path d="M8 4l2-2"/><path d="M14 10c0 0 2.5 2 2.5 3.5a2.5 2.5 0 01-5 0C11.5 12 14 10 14 10z"/>
          </svg>
        </div>
        <div class="icon-name">채우기</div>
      </div>
      <div class="icon-card">
        <div class="icon-box">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 1.5a2 2 0 012 2l-2 2-4-4 2-2a2 2 0 012 0v2z"/><path d="M10.5 5.5l-7 7v3h3l7-7"/><path d="M2.5 16.5l1-4"/>
          </svg>
        </div>
        <div class="icon-name">스포이드</div>
      </div>
    </div>
  </div>

  <div>
    <div class="section-title">Tools (Dark)</div>
    <div class="grid">
      <div class="icon-card">
        <div class="icon-box dark">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11.5 2.5l4 4L5.5 16.5H1.5v-4L11.5 2.5z"/><path d="M9.5 4.5l4 4"/>
          </svg>
        </div>
        <div class="icon-name">연필</div>
      </div>
      <div class="icon-card">
        <div class="icon-box dark">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15.5 9.5l-5-5-7 7 3 3h4l5-5z"/><path d="M3.5 11.5l5 5"/><line x1="8.5" y1="16.5" x2="16.5" y2="16.5"/>
          </svg>
        </div>
        <div class="icon-name">지우개</div>
      </div>
      <div class="icon-card">
        <div class="icon-box dark">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 12.5l7-7 3 3-7 7h-3v-3z"/><path d="M8 4l2-2"/><path d="M14 10c0 0 2.5 2 2.5 3.5a2.5 2.5 0 01-5 0C11.5 12 14 10 14 10z"/>
          </svg>
        </div>
        <div class="icon-name">채우기</div>
      </div>
      <div class="icon-card">
        <div class="icon-box dark">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.5 1.5a2 2 0 012 2l-2 2-4-4 2-2a2 2 0 012 0v2z"/><path d="M10.5 5.5l-7 7v3h3l7-7"/><path d="M2.5 16.5l1-4"/>
          </svg>
        </div>
        <div class="icon-name">스포이드</div>
      </div>
    </div>
  </div>
</div>

<div class="section-title">Actions</div>
<div class="grid">
  <div class="icon-card">
    <div class="icon-box">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12.5v2a2 2 0 002 2h8a2 2 0 002-2v-2"/><polyline points="6,7 9,4 12,7"/><line x1="9" y1="4" x2="9" y2="13"/>
      </svg>
    </div>
    <div class="icon-name">Export</div>
  </div>
  <div class="icon-card">
    <div class="icon-box">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12.5v2a2 2 0 002 2h8a2 2 0 002-2v-2"/><polyline points="6,8 9,11 12,8"/><line x1="9" y1="11" x2="9" y2="2"/>
      </svg>
    </div>
    <div class="icon-name">Import</div>
  </div>
  <div class="icon-card">
    <div class="icon-box">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 5h12"/><path d="M4.5 5v10a1.5 1.5 0 001.5 1.5h6a1.5 1.5 0 001.5-1.5V5"/><path d="M7 5V3.5a1 1 0 011-1h2a1 1 0 011 1V5"/>
      </svg>
    </div>
    <div class="icon-name">삭제</div>
  </div>
  <div class="icon-card">
    <div class="icon-box">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <line x1="9" y1="3" x2="9" y2="15"/><line x1="3" y1="9" x2="15" y2="9"/>
      </svg>
    </div>
    <div class="icon-name">추가</div>
  </div>
  <div class="icon-card">
    <div class="icon-box">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="14" height="14" rx="1.5"/><line x1="2" y1="9" x2="16" y2="9"/><line x1="9" y1="2" x2="9" y2="16"/>
      </svg>
    </div>
    <div class="icon-name">그리드</div>
  </div>
</div>

</body>
</html>
