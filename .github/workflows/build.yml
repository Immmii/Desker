name: Build Desktop Apps

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: Package macOS DMG
        working-directory: app
        run: npx electron-builder --mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Smoke test - DMG exists
        working-directory: app
        run: |
          DMG=$(find release -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "DMG not found in release/"
            exit 1
          fi
          echo "Found: $DMG ($(du -h "$DMG" | cut -f1))"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Desker-macOS
          path: app/release/*.dmg

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: Package Windows EXE
        working-directory: app
        run: npx electron-builder --win

      - name: Smoke test - app launches without crash
        working-directory: app
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path release\win-unpacked\Desker.exe -ErrorAction SilentlyContinue
          if (-not $exe) {
            Write-Error "Desker.exe not found in win-unpacked"
            exit 1
          }
          Write-Host "Found: $($exe.FullName) ($([math]::Round($exe.Length/1MB, 1)) MB)"

          # Launch app, wait 10s, check if process is still alive
          $proc = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 10

          if ($proc.HasExited) {
            Write-Error "App crashed on startup! Exit code: $($proc.ExitCode)"
            exit 1
          }

          Write-Host "App is running (PID: $($proc.Id)) - smoke test PASSED"
          Stop-Process -Id $proc.Id -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Desker-Windows
          path: app/release/*.exe
